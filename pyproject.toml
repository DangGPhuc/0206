[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "0206"
version = "2.0.0"
description = "Independent, Local-First, Evidence-Driven Malware Analysis & Reporting Platform"
readme = "README.md"
authors = [
    { name = "DangGPhuc" }
]
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]
dependencies = [
    "pefile>=2023.2.7",
    "scapy>=2.5.0",
    "capstone>=5.0.0",
    "python-docx>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "cryptography>=41.0.0"
]

[project.optional-dependencies]
ai = [
    "openai>=1.0.0",
    "anthropic>=0.18.0"
]
yara = [
    "yara-python>=4.3.0"
]
capa = [
    "flare-capa>=7.0.0"
]
all-open-source = [
    "yara-python>=4.3.0",
    "flare-capa>=7.0.0"
]
all = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "yara-python>=4.3.0",
    "flare-capa>=7.0.0"
]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0"
]

[project.scripts]
0206 = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*", "output*"]

[tool.setuptools]
py-modules = ["main", "config"]
