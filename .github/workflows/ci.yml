name: 0206 Triage & Security CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install System Dependencies (MinGW Cross-Compiler)
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-mingw-w64-x86-64

    - name: Install Core Package & Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev]"

    - name: Syntax & Bytecode Compilation Check
      run: |
        python -m compileall .

    - name: Security Static Analysis & Ruff Lint
      run: |
        python -m pip install ruff bandit
        ruff check core/ ai/ analyzers/ reporting/ --select E9,F63,F7,F82
        bandit -r core/ analyzers/ ai/ -s B101,B404,B603,B110,B310 --quiet

    - name: Supply-Chain & Data Guard Audit
      run: |
        python scripts/precommit_data_guard.py

    - name: Generate Harmless Test Artifacts
      run: |
        python tests/generate_test_artifacts.py

    - name: Run Test Suite
      run: |
        python -m pytest -q

    - name: Doctor Diagnostics
      run: |
        0206 doctor
        0206 capabilities

    - name: Platform Automated Self-Test
      run: |
        0206 selftest

    - name: End-to-End Offline Triage Run
      run: |
        0206 analyze tests/sample_benign_triage.exe --pcap tests/sample_traffic.pcap --procmon tests/sample_procmon.csv --offline --output-dir /tmp/ci_case_output
        ls -la /tmp/ci_case_output
        test -f /tmp/ci_case_output/report.json
        test -f /tmp/ci_case_output/report.md
        test -f /tmp/ci_case_output/report.docx
        test -f /tmp/ci_case_output/evidence.json
        test -f /tmp/ci_case_output/findings.json
        test -f /tmp/ci_case_output/analysis_manifest.json
        0206 manifest /tmp/ci_case_output/analysis_manifest.json
        0206 validate-case /tmp/ci_case_output

    - name: Discard Ephemeral Test Artifacts
      if: always()
      run: |
        rm -f tests/sample_benign_triage.exe tests/sample_traffic.pcap tests/sample_procmon.csv tests/sample_source.c
