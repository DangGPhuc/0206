name: 0206 Triage & Security CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Core Package & Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e .

    - name: Syntax & Bytecode Compilation Check
      run: |
        python -m compileall .

    - name: Supply-Chain & Data Guard Audit
      run: |
        python scripts/precommit_data_guard.py

    - name: Run Test Suite
      run: |
        python -m unittest discover -s tests -p "test_*.py"

    - name: Doctor Diagnostics
      run: |
        0206 doctor
        0206 capabilities

    - name: Platform Automated Self-Test
      run: |
        0206 selftest

    - name: End-to-End Offline Triage Run
      run: |
        0206 analyze tests/sample_benign_triage.exe --pcap tests/sample_traffic.pcap --procmon tests/sample_procmon.csv --offline --output-dir /tmp/ci_case_output
        ls -la /tmp/ci_case_output
        test -f /tmp/ci_case_output/report.json
        test -f /tmp/ci_case_output/report.md
        test -f /tmp/ci_case_output/report.docx
        test -f /tmp/ci_case_output/evidence.json
        test -f /tmp/ci_case_output/findings.json
        test -f /tmp/ci_case_output/analysis_manifest.json
        0206 manifest /tmp/ci_case_output/analysis_manifest.json
